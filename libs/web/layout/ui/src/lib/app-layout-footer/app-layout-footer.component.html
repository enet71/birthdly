@if (config.footer; as footer) {
  <p class="brand">
    @if (compact()) {
      © {{ year }} {{ config.appName }}
    } @else {
      <strong>{{ config.appName }}</strong> · {{ footer.tagline | transloco }}
    }
  </p>
  <nav class="links" [attr.aria-label]="'layout.siteLinks' | transloco">
    @for (link of links(); track link.path) {
      <a class="link" [routerLink]="link.path">{{ (compact() ? (link.shortLabel ?? link.label) : link.label) | transloco }}</a>
    }
  </nav>
}
