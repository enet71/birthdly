# The production stack on the droplet, in /opt/birthdly. `deploy.sh` runs it; see README.md.
name: birthdly

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    # `deploy.sh` sets the tags from release.env: the commit SHA each image was built from. The image names are only
    # overridden to test locally.
    image: ${API_IMAGE:-ghcr.io/enet71/birthday-api}:${API_TAG:?API_TAG is not set}
    env_file: .env
    environment:
      NODE_ENV: production
      # Must stay empty: production's Google Calendar events were created before the tag existed, and any other value
      # would give every birthday a new event and leave the old ones as duplicates. See libs/api/google-calendar.
      GOOGLE_CALENDAR_EVENT_TAG: ''
      # Built from POSTGRES_PASSWORD, so .env needs no DATABASE_URL.
      DATABASE_URL: postgresql://birthdly:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@postgres:5432/birthdly
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # Probes every 2 seconds while starting, so `docker compose up --wait` returns soon after the API is ready.
      start_interval: 2s
    logging: *logging

  # The stack reaches it on its own network. The data lives on the postgres_data volume, which deployments and
  # rollbacks never remove.
  postgres:
    image: postgres:17-alpine
    # Only on the droplet's loopback, for an SSH tunnel from a database client (see README); never reachable from outside.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: birthdly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: birthdly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Over TCP: while it initialises a new volume, the image runs a temporary server that answers only on the socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U birthdly -d birthdly']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/enet71/birthday-web}:${WEB_TAG:?WEB_TAG is not set}
    environment:
      NODE_ENV: production
      # Caddy sets these headers; Angular SSR ignores proxy headers it is not told to trust.
      NG_TRUST_PROXY_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-proto
      # Server rendering calls the API on the private Docker network rather than through the public domain.
      API_INTERNAL_URL: http://api:3000
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/robots.txt > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # Creates Umami's role and database in the stack's Postgres if they are missing, and sets the role's password from
  # .env, then exits. Runs on every deployment. The app's database is closed to every role but its owner, so a
  # compromised Umami cannot reach it.
  umami-db:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: birthdly
      PGDATABASE: birthdly
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is not set}
    entrypoint: ['sh', '-c']
    command:
      - |
        psql -q -v ON_ERROR_STOP=1 -v password="$$UMAMI_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE umami LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'umami') \gexec
        ALTER ROLE umami PASSWORD :'password';
        SELECT 'CREATE DATABASE umami OWNER umami' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami') \gexec
        REVOKE CONNECT ON DATABASE birthdly FROM PUBLIC;
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  # Self-hosted web analytics. The dashboard is on stats.birthdly.com; birthdly.com serves only the tracker script and
  # the collect endpoint under /m/ (see Caddyfile).
  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is not set}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is not set}
      # Neutral names, so ad blockers that match Umami's defaults (script.js, /api/send) let them through.
      TRACKER_SCRIPT_NAME: m.js
      COLLECT_API_ENDPOINT: /e
      # Caddy replaces X-Forwarded-For with the visitor's address alone.
      CLIENT_IP_HEADER: x-forwarded-for
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
    depends_on:
      umami-db:
        condition: service_completed_successfully
    # Keeps a leak in analytics from taking memory from the app on the 2 GB droplet.
    mem_limit: 384m
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/heartbeat > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start applies its database migrations.
      start_period: 90s
      start_interval: 2s
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
