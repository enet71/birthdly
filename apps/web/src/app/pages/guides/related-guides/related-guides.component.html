<h2 class="title">{{ 'guides.related' | transloco }}</h2>
<ul class="links">
  @for (guide of guides(); track guide.slug) {
    <li>
      <a [routerLink]="getGuidePath(guide) | localizedPath">{{ guide.title | transloco }}</a>
    </li>
  }
  <li>
    <a [routerLink]="'/guides' | localizedPath">{{ 'about.allGuides' | transloco }}</a>
  </li>
  <li>
    <a [routerLink]="'/about' | localizedPath">{{ 'guides.aboutAndFaq' | transloco }}</a>
  </li>
</ul>
